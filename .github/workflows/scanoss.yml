name: ScanOSS SBOM Scan

on:
  push:
    branches:
      - main

jobs:
  scanoss:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip


      # ---------------------------------------------------------
      # 3. Identify changed files in triggering commit
      # ---------------------------------------------------------
      - name: Show changed files in triggering commit
        shell: bash
        run: |
          echo "Commit SHA: $GITHUB_SHA"

          echo "Commit message:"
          git log -1 --pretty=%B "$GITHUB_SHA"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------"

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            --root \
            "$GITHUB_SHA" | tee changed-files.txt

          echo "----------------------------------------"

          echo ""
          echo "Contents of changed-files.txt:"
          cat changed-files.txt

          echo ""
          echo "Checking that changed-files.txt exists:"
          ls -lh changed-files.txt


      # ---------------------------------------------------------
      # 4. Create complete repository file inventory
      #
      # This lists EVERY tracked file in the repository and
      # identifies whether it was changed by the triggering
      # commit.
      # ---------------------------------------------------------
      - name: Create repository file status report
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit message:"
          git log -1 --pretty=%B "$GITHUB_SHA"

          echo ""
          echo "Creating repository-file-status.csv..."

          python - <<'PY'
          import csv
          import subprocess

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True
          ).strip()

          # Get all files currently tracked in the repository
          all_files = subprocess.check_output(
              ["git", "ls-files"],
              text=True
          ).splitlines()

          # Get changed files in the triggering commit
          changed_output = subprocess.check_output(
              [
                  "git", "diff-tree",
                  "--no-commit-id",
                  "--name-status",
                  "-r",
                  "--root",
                  commit
              ],
              text=True
          ).splitlines()

          changed = {}

          for line in changed_output:
              parts = line.split("\t")

              if len(parts) >= 2:
                  status = parts[0]
                  filename = parts[-1]
                  changed[filename] = status

          with open("repository-file-status.csv", "w", newline="") as f:
              writer = csv.writer(f)

              writer.writerow([
                  "file",
                  "status",
                  "changed_in_triggering_commit"
              ])

              for filename in all_files:
                  if filename in changed:
                      writer.writerow([
                          filename,
                          changed[filename],
                          "YES"
                      ])
                  else:
                      writer.writerow([
                          filename,
                          "UNCHANGED",
                          "NO"
                      ])

          print("")
          print("Repository file status report:")
          print("----------------------------------------")

          with open("repository-file-status.csv") as f:
              print(f.read())

          print("----------------------------------------")
          print(f"Total repository files: {len(all_files)}")
          print(f"Files changed in triggering commit: {len(changed)}")
          PY

      # ---------------------------------------------------------
      # 5. Install ScanOSS
      # ---------------------------------------------------------
      - name: Install ScanOSS
        run: |
          python -m pip install --upgrade pip
          pip install scanoss


      # ---------------------------------------------------------
      # 6. Check ScanOSS version
      # ---------------------------------------------------------
      - name: Check ScanOSS version
        run: |
          scanoss-py version


      # ---------------------------------------------------------
      # 7. Install ScanCode Toolkit
      #
      # Required because the ScanOSS scan uses dependency
      # scanning.
      # ---------------------------------------------------------
      - name: Install ScanCode Toolkit
        run: |
          pip install scancode-toolkit


      # ---------------------------------------------------------
      # 8. Check ScanCode version
      # ---------------------------------------------------------
      - name: Check ScanCode version
        run: |
          scancode --version


      # ---------------------------------------------------------
      # 9. Run FULL ScanOSS scan
      #
      # IMPORTANT:
      # The "." means the ENTIRE repository is scanned.
      #
      # This is intentionally NOT an incremental scan.
      # Therefore unchanged files remain represented in the
      # resulting SBOM/component inventory.
      # ---------------------------------------------------------
      - name: Run ScanOSS
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
        run: |
          scanoss-py scan \
            --dependencies \
            -o scan-results.json \
            . \
            -hdr "x-api-key:${SCANOSS_API_KEY}"


      # ---------------------------------------------------------
      # 10. Generate CycloneDX SBOM
      # ---------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format cyclonedx \
            --output scanoss-cyclonedx.json


      # ---------------------------------------------------------
      # 11. Generate SPDX-Lite SBOM
      # ---------------------------------------------------------
      - name: Generate SPDX-Lite SBOM
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format spdxlite \
            --output scanoss-spdx-lite.json


      # ---------------------------------------------------------
      # 12. Generate JSON report
      #
      # scan-results.json is the native ScanOSS JSON output.
      # ---------------------------------------------------------
      - name: Generate JSON report
        run: |
          cp scan-results.json scanoss-json-report.json


      # ---------------------------------------------------------
      # 13. Generate CSV report
      # ---------------------------------------------------------
      - name: Generate CSV report
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format csv \
            --output scanoss-report.csv


      # ---------------------------------------------------------
      # 14. Scan SBOM for vulnerabilities
      # ---------------------------------------------------------
      - name: Scan SBOM for vulnerabilities
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
        run: |
          scanoss-py comp vulns \
            -i scanoss-cyclonedx.json \
            -o vulnerabilities.json \
            -hdr "x-api-key:${SCANOSS_API_KEY}"


      # ---------------------------------------------------------
      # 15. Generate vulnerability summary CSV
      # ---------------------------------------------------------
      - name: Generate vulnerability summary CSV
        run: |
          python - <<'PY'
          import json
          import csv

          input_file = "vulnerabilities.json"
          output_file = "vulnerability-summary.csv"

          try:
              with open(
                  input_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

          except Exception as e:
              print(
                  f"Could not read vulnerability report: {e}"
              )
              data = {}

          rows = []

          components = data.get(
              "components",
              []
          )

          for component in components:

              purl = component.get(
                  "purl",
                  ""
              )

              requirement = component.get(
                  "requirement",
                  ""
              )

              version = component.get(
                  "version",
                  ""
              )

              vulnerabilities = component.get(
                  "vulnerabilities",
                  []
              )

              if vulnerabilities:

                  for vuln in vulnerabilities:

                      rows.append({
                          "PURL": purl,
                          "Requirement": requirement,
                          "Version": version,
                          "CVE": vuln.get(
                              "cve",
                              ""
                          ),
                          "Severity": vuln.get(
                              "severity",
                              ""
                          ),
                          "CVSS": vuln.get(
                              "cvss",
                              ""
                          ),
                          "EPSS": vuln.get(
                              "epss",
                              ""
                          ),
                          "Summary": vuln.get(
                              "summary",
                              ""
                          ),
                          "URL": vuln.get(
                              "url",
                              ""
                          )
                      })

              else:

                  rows.append({
                      "PURL": purl,
                      "Requirement": requirement,
                      "Version": version,
                      "CVE": "",
                      "Severity": "",
                      "CVSS": "",
                      "EPSS": "",
                      "Summary": "",
                      "URL": ""
                  })

          fieldnames = [
              "PURL",
              "Requirement",
              "Version",
              "CVE",
              "Severity",
              "CVSS",
              "EPSS",
              "Summary",
              "URL"
          ]

          with open(
              output_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fieldnames
              )

              writer.writeheader()
              writer.writerows(rows)

          print(
              f"Created {output_file}"
          )

          print(
              f"Rows written: {len(rows)}"
          )
          PY


      # ---------------------------------------------------------
      # 16. Set up Go
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'


      # ---------------------------------------------------------
      # 17. Install OpenGrep
      # ---------------------------------------------------------
      - name: Install OpenGrep
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/opengrep/opengrep/v1.12.1/install.sh \
            | bash

          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"


      # ---------------------------------------------------------
      # 18. Check OpenGrep version
      # ---------------------------------------------------------
      - name: Check OpenGrep version
        run: |
          echo "OpenGrep location:"
          which opengrep

          echo ""
          echo "OpenGrep version:"
          opengrep --version


      # ---------------------------------------------------------
      # 19. Install Crypto Finder
      # ---------------------------------------------------------
      - name: Install Crypto Finder
        run: |
          go install \
            github.com/scanoss/crypto-finder/cmd/crypto-finder@latest

          echo "$HOME/go/bin" >> "$GITHUB_PATH"


      # ---------------------------------------------------------
      # 20. Check Crypto Finder
      #
      # Crypto Finder does NOT support --version.
      # --help is used to verify the installation.
      # ---------------------------------------------------------
      - name: Check Crypto Finder installation
        run: |
          which crypto-finder
          crypto-finder --help


      # ---------------------------------------------------------
      # 21. Run Crypto Finder and generate FULL CBOM
      #
      # "." means the entire repository.
      #
      # SCANOSS_API_KEY is required so Crypto Finder can access
      # its remote ruleset.
      # ---------------------------------------------------------
      - name: Run Crypto Finder and generate CBOM
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
        run: |
          crypto-finder scan \
            --format cyclonedx \
            --output scanoss-cbom.json \
            .


      # ---------------------------------------------------------
      # 22. Generate consolidated report
      #
      # This report contains:
      #
      # 1. ScanOSS component results
      # 2. Vulnerability results
      # 3. EVERY repository file
      #    - Changed
      #    - Unchanged
      #
      # Therefore the consolidated report explicitly shows the
      # relationship between the current commit and the complete
      # repository inventory.
      # ---------------------------------------------------------
      - name: Generate consolidated report
        run: |
          python - <<'PY'
          import json
          import csv
          import os

          print("Generating consolidated report...")

          # ---------------------------------------------------------
          # Load SCANOSS scan results
          # ---------------------------------------------------------
          scan_results = {}

          if os.path.exists("scan-results.json"):
              with open("scan-results.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              print("Loaded scan-results.json")

              # SCANOSS JSON normally contains components under
              # the "components" section or package information.
              components = data.get("components", [])

              for component in components:
                  purl = component.get("purl", "")
                  name = component.get("name", "")
                  version = component.get("version", "")

                  licenses = []

                  # Try common license locations
                  if isinstance(component.get("licenses"), list):
                      for lic in component["licenses"]:
                          if isinstance(lic, dict):
                              license_obj = lic.get("license", {})
                              if isinstance(license_obj, dict):
                                  lic_id = license_obj.get("id")
                                  lic_name = license_obj.get("name")

                                  if lic_id:
                                      licenses.append(lic_id)
                                  elif lic_name:
                                      licenses.append(lic_name)

                  license_value = ", ".join(licenses) if licenses else "UNKNOWN"

                  # Store using PURL
                  if purl:
                      scan_results[purl] = {
                          "name": name,
                          "version": version,
                          "license": license_value
                      }

                  # Also store using name/version
                  if name and version:
                      scan_results[f"{name}|{version}"] = {
                          "name": name,
                          "version": version,
                          "license": license_value
                      }

          # ---------------------------------------------------------
          # Load vulnerability information
          # ---------------------------------------------------------
          vulnerabilities = []

          if os.path.exists("vulnerabilities.json"):
              with open("vulnerabilities.json", "r", encoding="utf-8") as f:
                  vuln_data = json.load(f)

              print("Loaded vulnerabilities.json")

              if isinstance(vuln_data, dict):
                  vulnerabilities = vuln_data.get("components", [])

          # ---------------------------------------------------------
          # Load changed files
          # ---------------------------------------------------------
          changed_files = []

          if os.path.exists("changed-files.txt"):
              with open("changed-files.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()

                      if not line:
                          continue

                      parts = line.split("\t", 1)

                      if len(parts) == 2:
                          status, filename = parts
                      else:
                          status = ""
                          filename = parts[0]

                      changed_files.append((status, filename))

          # ---------------------------------------------------------
          # Create consolidated report
          # ---------------------------------------------------------
          output_file = "consolidated-report.csv"

          headers = [
              "Report Type",
              "Component",
              "Version",
              "PURL",
              "License",
              "Vulnerability",
              "Severity",
              "Changed File"
          ]

          with open(
              output_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)
              writer.writerow(headers)

              # -----------------------------------------------------
              # Vulnerability rows
              # -----------------------------------------------------
              for component in vulnerabilities:

                  purl = component.get("purl", "")
                  requirement = component.get("requirement", "")
                  version = component.get("version", "")
                  name = component.get("name", "")

                  # Some SCANOSS vulnerability reports use purl
                  # rather than name.
                  if not name and purl:
                      name = purl

                  # Find license information
                  license_value = "UNKNOWN"

                  if purl in scan_results:
                      license_value = scan_results[purl]["license"]

                  elif f"{name}|{version}" in scan_results:
                      license_value = scan_results[
                          f"{name}|{version}"
                      ]["license"]

                  component_vulns = component.get("vulnerabilities", [])

                  if component_vulns:

                      for vuln in component_vulns:

                          cve = vuln.get(
                              "cve",
                              vuln.get("id", "")
                          )

                          severity = vuln.get(
                              "severity",
                              ""
                          )

                          writer.writerow([
                              "Vulnerability",
                              name,
                              version or requirement,
                              purl,
                              license_value,
                              cve,
                              severity,
                              ""
                          ])

                  else:

                      writer.writerow([
                          "Component",
                          name,
                          version or requirement,
                          purl,
                          license_value,
                          "",
                          "",
                          ""
                      ])

              # -----------------------------------------------------
              # Changed-file rows
              # -----------------------------------------------------
              for status, filename in changed_files:

                  writer.writerow([
                      "Changed File",
                      "",
                      "",
                      "",
                      "",
                      "",
                      status,
                      filename
                  ])

          print("")
          print("Consolidated report created:")
          print(output_file)

          print("")
          print("License mapping entries:", len(scan_results))
          print("Vulnerability entries:", len(vulnerabilities))
          print("Changed files:", len(changed_files))
          PY


      # ---------------------------------------------------------
      # 23. Display generated reports
      # ---------------------------------------------------------
      - name: List generated reports
        run: |
          echo "Generated reports:"
          echo "----------------------------------------"

          ls -lh \
            scan-results.json \
            scanoss-json-report.json \
            scanoss-cyclonedx.json \
            scanoss-spdx-lite.json \
            scanoss-report.csv \
            vulnerabilities.json \
            vulnerability-summary.csv \
            scanoss-cbom.json \
            changed-files.txt \
            repository-file-status.csv \
            consolidated-report.csv

          echo "----------------------------------------"


      # ---------------------------------------------------------
      # 24. Upload all reports as one artifact
      # ---------------------------------------------------------
      - name: Upload SCANOSS reports and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-reports
          path: |
            scan-results.json
            scanoss-json-report.json
            scanoss-cyclonedx.json
            scanoss-spdx-lite.json
            scanoss-report.csv
            vulnerabilities.json
            vulnerability-summary.csv
            scanoss-cbom.json
            changed-files.txt
            repository-file-status.csv
            consolidated-report.csv
          if-no-files-found: error
