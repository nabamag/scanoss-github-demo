name: scanoss

on:
  push:
  workflow_dispatch:

jobs:
  scanoss:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------
      # 2. SHOW REPOSITORY FILES
      # --------------------------------------------

      - name: Show repository files
        run: |
          echo "Repository files:"
          echo "----------------------------------------"
          find . -type f -not -path './.git/*' | sort
          echo "----------------------------------------"


      # --------------------------------------------
      # 3. SET UP PYTHON
      # --------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------
      # 4. INSTALL SCANOSS
      # --------------------------------------------

      - name: Install ScanOSS
        run: |
          python -m pip install --upgrade pip
          pip install scanoss
          pip install scanoss_winnowing


      # --------------------------------------------
      # 5. INSTALL SCANCODE
      #
      # Required for ScanOSS dependency scanning (-D)
      # --------------------------------------------

      - name: Install ScanCode
        run: |
          pip install scancode-toolkit


      # --------------------------------------------
      # 6. CHECK SCANOSS VERSION
      # --------------------------------------------

      - name: Check ScanOSS version
        run: |
          scanoss-py --version


      # --------------------------------------------
      # 7. RUN SCANOSS
      #
      # -D enables dependency scanning.
      # --threads 10 enables parallel scanning.
      # --retry 10 gives the SCANOSS API more retries.
      # The outer loop protects against temporary
      # service failures such as HTTP 503.
      # --------------------------------------------

      - name: Run ScanOSS
        run: |
          set -e

          for attempt in 1 2 3; do

            echo "========================================"
            echo "ScanOSS attempt $attempt of 3"
            echo "========================================"

            if scanoss-py scan \
              -o scan-results.json \
              -D \
              --threads 10 \
              --retry 10 \
              --timeout 180 \
              .; then

              echo "ScanOSS completed successfully."
              break

            fi

            if [ "$attempt" -lt 3 ]; then
              echo ""
              echo "ScanOSS failed."
              echo "Waiting 30 seconds before retry..."
              sleep 30
            else
              echo ""
              echo "ScanOSS failed after 3 attempts."
              exit 1
            fi

          done


      # --------------------------------------------
      # 8. GENERATE CYCLONEDX SBOM
      # --------------------------------------------

      - name: Generate CycloneDX SBOM
        run: |
          scanoss-py cnv \
            -i scan-results.json \
            --format cyclonedx \
            -o scanoss-cyclonedx.json


      # --------------------------------------------
      # 9. GENERATE SPDX-LITE SBOM
      # --------------------------------------------

      - name: Generate SPDX Lite SBOM
        run: |
          scanoss-py cnv \
            -i scan-results.json \
            --format spdxlite \
            -o scanoss-spdx-lite.json


      # --------------------------------------------
      # 10. GENERATE JSON REPORT
      # --------------------------------------------

      - name: Generate JSON report
        run: |
          cp scan-results.json scanoss-json-report.json


      # --------------------------------------------
      # 11. GENERATE CSV REPORT
      # --------------------------------------------

      - name: Generate CSV report
        run: |
          scanoss-py cnv \
            -i scan-results.json \
            --format csv \
            -o scanoss-report.csv


      # --------------------------------------------
      # 12. SCAN SBOM FOR VULNERABILITIES
      # --------------------------------------------

      - name: Scan SBOM for vulnerabilities
        run: |
          scanoss-py comp vulns \
            -i scanoss-cyclonedx.json \
            -o vulnerabilities.json


      # --------------------------------------------
      # 13. GENERATE VULNERABILITY SUMMARY CSV
      # --------------------------------------------

      - name: Generate vulnerability summary CSV
        run: |
          python - <<'PY'
          import json
          import csv

          input_file = "vulnerabilities.json"
          output_file = "vulnerability-summary.csv"

          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Could not read vulnerability report: {e}")
              data = {}

          rows = []

          for component in data.get("components", []):
              purl = component.get("purl", "")
              requirement = component.get("requirement", "")
              version = component.get("version", "")

              vulnerabilities = component.get("vulnerabilities", [])

              if not vulnerabilities:
                  rows.append({
                      "Report Type": "Component",
                      "Component": purl,
                      "Version": version,
                      "PURL": purl,
                      "Vulnerability": "",
                      "Severity": "",
                      "CVSS": "",
                      "Summary": ""
                  })

              for vuln in vulnerabilities:
                  rows.append({
                      "Report Type": "Vulnerability",
                      "Component": purl,
                      "Version": version,
                      "PURL": purl,
                      "Vulnerability": vuln.get("id", vuln.get("cve", "")),
                      "Severity": vuln.get("severity", ""),
                      "CVSS": (
                          vuln.get("cvss", "")
                          if isinstance(vuln.get("cvss", ""), (str, int, float))
                          else ""
                      ),
                      "Summary": vuln.get("summary", "")
                  })

          fieldnames = [
              "Report Type",
              "Component",
              "Version",
              "PURL",
              "Vulnerability",
              "Severity",
              "CVSS",
              "Summary"
          ]

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Created {output_file} with {len(rows)} rows.")
          PY


      # --------------------------------------------
      # 14. SET UP GO
      # --------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"


      # --------------------------------------------
      # 15. INSTALL OPENGREP
      # --------------------------------------------

      - name: Install OpenGrep
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/opengrep/opengrep/v1.12.1/install.sh \
            | bash

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # --------------------------------------------
      # 16. CHECK OPENGREP
      # --------------------------------------------

      - name: Check OpenGrep
        run: |
          opengrep --version


      # --------------------------------------------
      # 17. INSTALL CRYPTO FINDER
      # --------------------------------------------

      - name: Install Crypto Finder
        run: |
          go install github.com/scanoss/crypto-finder/cmd/crypto-finder@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          ls -l "$HOME/go/bin/crypto-finder"


      # --------------------------------------------
      # 18. CHECK CRYPTO FINDER
      #
      # crypto-finder does not use --version in the
      # version installed in this workflow.
      # --------------------------------------------

      - name: Check Crypto Finder
        run: |
          crypto-finder --help


      # --------------------------------------------
      # 19. RUN CRYPTO FINDER AND GENERATE CBOM
      # --------------------------------------------

      - name: Run Crypto Finder and generate CBOM
        run: |
          crypto-finder scan \
            --format cyclonedx \
            --output scanoss-cbom.json \
            .


      # --------------------------------------------
      # 20. SHOW CHANGED FILES IN TRIGGERING COMMIT
      # --------------------------------------------

      - name: Show changed files in triggering commit
        run: |
          echo "Commit SHA: $GITHUB_SHA"

          echo "Commit message:"
          git log -1 --pretty=%B "$GITHUB_SHA"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------"

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            --root \
            "$GITHUB_SHA" | tee changed-files.txt

          echo "----------------------------------------"

          echo ""
          echo "Contents of changed-files.txt:"
          cat changed-files.txt

          echo ""
          echo "Checking that changed-files.txt exists:"
          ls -l changed-files.txt


      # --------------------------------------------
      # 21. CREATE COMPLETE REPOSITORY FILE STATUS
      #
      # This gives us BOTH:
      # M = Changed
      # U = Unchanged
      #
      # Unlike git diff-tree, this lists every tracked
      # file in the repository.
      # --------------------------------------------

      - name: Create repository file status report
        run: |
          python - <<'PY'
          import csv
          import subprocess

          changed = {}

          try:
              result = subprocess.run(
                  [
                      "git",
                      "diff-tree",
                      "--no-commit-id",
                      "--name-status",
                      "-r",
                      "--root",
                      "HEAD"
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              for line in result.stdout.splitlines():
                  parts = line.split("\t")

                  if len(parts) >= 2:
                      status = parts[0]
                      path = parts[-1]
                      changed[path] = status

          except Exception as e:
              print(f"Could not determine changed files: {e}")

          tracked = subprocess.run(
              [
                  "git",
                  "ls-tree",
                  "-r",
                  "--name-only",
                  "HEAD"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          files = [
              line.strip()
              for line in tracked.stdout.splitlines()
              if line.strip()
          ]

          with open(
              "repository-file-status.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "File Status",
                  "File"
              ])

              for path in files:
                  status = changed.get(path, "U")
                  writer.writerow([
                      status,
                      path
                  ])

          print(
              f"Created repository-file-status.csv "
              f"with {len(files)} files."
          )
          PY

          echo ""
          echo "Repository file status:"
          cat repository-file-status.csv


      # --------------------------------------------
      # 22. GENERATE CONSOLIDATED REPORT
      #
      # Combines:
      # - SCANOSS component information
      # - License
      # - Vulnerability information
      # - Changed/unchanged file status
      #
      # License is taken from the SCANOSS JSON result
      # rather than assuming it from the vulnerability
      # report.
      # --------------------------------------------

      - name: Generate consolidated report
        run: |
          python - <<'PY'
          import csv
          import json
          import os

          scan_file = "scan-results.json"
          vuln_file = "vulnerabilities.json"
          status_file = "repository-file-status.csv"
          output_file = "consolidated-report.csv"

          # ----------------------------------------
          # Read repository file status
          # ----------------------------------------

          file_status = {}

          if os.path.exists(status_file):
              with open(
                  status_file,
                  "r",
                  encoding="utf-8"
              ) as f:

                  reader = csv.DictReader(f)

                  for row in reader:
                      file_status[row["File"]] = row["File Status"]

          # ----------------------------------------
          # Read SCANOSS results
          # ----------------------------------------

          with open(
              scan_file,
              "r",
              encoding="utf-8"
          ) as f:
              scan_data = json.load(f)

          # ----------------------------------------
          # Read vulnerability results
          # ----------------------------------------

          vulnerabilities = {}

          if os.path.exists(vuln_file):
              try:
                  with open(
                      vuln_file,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      vuln_data = json.load(f)

                  for component in vuln_data.get(
                      "components",
                      []
                  ):
                      purl = component.get(
                          "purl",
                          ""
                      )

                      for vuln in component.get(
                          "vulnerabilities",
                          []
                      ):

                          vuln_id = vuln.get(
                              "id",
                              vuln.get("cve", "")
                          )

                          vulnerabilities.setdefault(
                              purl,
                              []
                          ).append({
                              "id": vuln_id,
                              "severity": vuln.get(
                                  "severity",
                                  ""
                              ),
                              "summary": vuln.get(
                                  "summary",
                                  ""
                              )
                          })

              except Exception as e:
                  print(
                      f"Warning: could not read "
                      f"vulnerability report: {e}"
                  )

          # ----------------------------------------
          # Helper for license extraction
          # ----------------------------------------

          def get_license(item):
              candidates = [
                  item.get("licenses"),
                  item.get("license"),
                  item.get("declared_licenses"),
                  item.get("declared_license")
              ]

              for value in candidates:
                  if value:
                      if isinstance(value, list):
                          values = []

                          for v in value:
                              if isinstance(v, dict):
                                  values.append(
                                      str(
                                          v.get(
                                              "name",
                                              v.get(
                                                  "id",
                                                  ""
                                              )
                                          )
                                      )
                                  )
                              else:
                                  values.append(str(v))

                          values = [
                              v for v in values if v
                          ]

                          if values:
                              return "; ".join(values)

                      elif isinstance(value, dict):
                          result = (
                              value.get("name")
                              or value.get("id")
                              or ""
                          )

                          if result:
                              return str(result)

                      else:
                          return str(value)

              return "UNKNOWN"

          # ----------------------------------------
          # Extract SCANOSS component results
          # ----------------------------------------

          rows = []

          if isinstance(scan_data, dict):

              for file_path, results in scan_data.items():

                  if not isinstance(results, list):
                      continue

                  status = file_status.get(
                      file_path,
                      "U"
                  )

                  for item in results:

                      if not isinstance(item, dict):
                          continue

                      purl = item.get(
                          "purl",
                          ""
                      )

                      component = (
                          item.get("component")
                          or item.get("name")
                          or ""
                      )

                      version = item.get(
                          "version",
                          ""
                      )

                      license_value = get_license(
                          item
                      )

                      for vuln in vulnerabilities.get(
                          purl,
                          []
                      ):

                          rows.append({
                              "Report Type":
                                  "Vulnerability",
                              "Component":
                                  component,
                              "Version":
                                  version,
                              "PURL":
                                  purl,
                              "License":
                                  license_value,
                              "Vulnerability":
                                  vuln["id"],
                              "Severity":
                                  vuln["severity"],
                              "Changed File":
                                  status,
                              "File":
                                  file_path
                          })

                      if not vulnerabilities.get(
                          purl,
                          []
                      ):

                          rows.append({
                              "Report Type":
                                  "Component",
                              "Component":
                                  component,
                              "Version":
                                  version,
                              "PURL":
                                  purl,
                              "License":
                                  license_value,
                              "Vulnerability":
                                  "",
                              "Severity":
                                  "",
                              "Changed File":
                                  status,
                              "File":
                                  file_path
                          })

          # ----------------------------------------
          # Add files that were not matched by SCANOSS
          #
          # This ensures the consolidated report
          # still represents the entire repository.
          # ----------------------------------------

          scanned_files = {
              row["File"]
              for row in rows
              if row.get("File")
          }

          for path, status in file_status.items():

              if path not in scanned_files:

                  rows.append({
                      "Report Type":
                          "File",
                      "Component":
                          "",
                      "Version":
                          "",
                      "PURL":
                          "",
                      "License":
                          "",
                      "Vulnerability":
                          "",
                      "Severity":
                          "",
                      "Changed File":
                          status,
                      "File":
                          path
                  })

          # ----------------------------------------
          # Write consolidated report
          # ----------------------------------------

          fieldnames = [
              "Report Type",
              "Component",
              "Version",
              "PURL",
              "License",
              "Vulnerability",
              "Severity",
              "Changed File",
              "File"
          ]

          with open(
              output_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fieldnames
              )

              writer.writeheader()
              writer.writerows(rows)

          print(
              f"Created {output_file} "
              f"with {len(rows)} rows."
          )
          PY

          echo ""
          echo "Consolidated report:"
          echo "----------------------------------------"
          cat consolidated-report.csv


      # --------------------------------------------
      # 23. LIST GENERATED REPORTS
      # --------------------------------------------

      - name: List generated reports
        if: always()
        run: |
          echo "Generated reports:"
          echo "----------------------------------------"

          ls -lh \
            changed-files.txt \
            repository-file-status.csv \
            consolidated-report.csv \
            scan-results.json \
            scanoss-cbom.json \
            scanoss-cyclonedx.json \
            scanoss-json-report.json \
            scanoss-report.csv \
            scanoss-spdx-lite.json \
            vulnerabilities.json \
            vulnerability-summary.csv \
            2>/dev/null || true

          echo "----------------------------------------"


      # --------------------------------------------
      # 24. UPLOAD ALL REPORTS
      # --------------------------------------------

      - name: Upload SCANOSS reports and SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-reports
          path: |
            changed-files.txt
            repository-file-status.csv
            consolidated-report.csv
            scan-results.json
            scanoss-cbom.json
            scanoss-cyclonedx.json
            scanoss-json-report.json
            scanoss-report.csv
            scanoss-spdx-lite.json
            vulnerabilities.json
            vulnerability-summary.csv
          if-no-files-found: warn
