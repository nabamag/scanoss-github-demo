- name: Set up Go
  uses: actions/setup-go@v6
  with:
    go-version: "1.25"

- name: Install OpenGrep
  run: |
    curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/v1.12.1/install.sh | bash
    echo "$HOME/.local/bin" >> "$GITHUB_PATH"

- name: Check OpenGrep version
  run: |
    opengrep --version

- name: Install Crypto Finder
  run: |
    go install github.com/scanoss/crypto-finder/cmd/crypto-finder@latest
    echo "$HOME/go/bin" >> "$GITHUB_PATH"
    ls -l "$HOME/go/bin/crypto-finder"

- name: Check Crypto Finder version
  run: |
    crypto-finder version

- name: Run Crypto Finder and generate CBOM
  env:
    SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
  run: |
    crypto-finder scan \
      --format cyclonedx \
      --output scanoss-cbom.json \
      .
