name: ScanOSS SBOM Scan

on:
  push:
    branches:
      - main

jobs:
  scanoss:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Show repository files
      # ---------------------------------------------------------
      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print

      # ---------------------------------------------------------
      # 3. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------
      # 4. Install ScanOSS
      # ---------------------------------------------------------
      - name: Install ScanOSS
        run: |
          python -m pip install --upgrade pip
          pip install scanoss

      # ---------------------------------------------------------
      # 5. Check ScanOSS version
      # ---------------------------------------------------------
      - name: Check ScanOSS version
        run: |
          scanoss-py version

      # ---------------------------------------------------------
      # 6. Install ScanCode Toolkit
      #
      # REQUIRED because the ScanOSS scan below uses -D
      # / --dependencies.
      # ---------------------------------------------------------
      - name: Install ScanCode Toolkit
        run: |
          pip install scancode-toolkit

      # ---------------------------------------------------------
      # 7. Check ScanCode version
      # ---------------------------------------------------------
      - name: Check ScanCode version
        run: |
          scancode --version

      # ---------------------------------------------------------
      # 8. Run ScanOSS
      #
      # -D = include dependency scanning
      #
      # The API key is supplied through the GitHub secret
      # SCANOSS_API_KEY.
      # ---------------------------------------------------------
      - name: Run ScanOSS
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
        run: |
          scanoss-py scan \
            --dependencies \
            -o scan-results.json \
            . \
            -hdr "x-api-key:${SCANOSS_API_KEY}"

      # ---------------------------------------------------------
      # 9. Generate CycloneDX SBOM
      # ---------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format cyclonedx \
            --output scanoss-cyclonedx.json

      # ---------------------------------------------------------
      # 10. Generate SPDX-Lite SBOM
      # ---------------------------------------------------------
      - name: Generate SPDX-Lite SBOM
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format spdxlite \
            --output scanoss-spdx-lite.json

      # ---------------------------------------------------------
      # 11. Generate JSON report
      #
      # scan-results.json is already the native ScanOSS
      # JSON output.
      # ---------------------------------------------------------
      - name: Generate JSON report
        run: |
          cp scan-results.json scanoss-json-report.json

      # ---------------------------------------------------------
      # 12. Generate CSV report
      # ---------------------------------------------------------
      - name: Generate CSV report
        run: |
          scanoss-py convert \
            --input scan-results.json \
            --format csv \
            --output scanoss-report.csv

      # ---------------------------------------------------------
      # 13. Scan SBOM for vulnerabilities
      # ---------------------------------------------------------
      - name: Scan SBOM for vulnerabilities
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
        run: |
          scanoss-py comp vulns \
            -i scanoss-cyclonedx.json \
            -o vulnerabilities.json \
            -hdr "x-api-key:${SCANOSS_API_KEY}"

      # ---------------------------------------------------------
      # 14. Generate vulnerability summary CSV
      # ---------------------------------------------------------
      - name: Generate vulnerability summary CSV
        run: |
          python - <<'PY'
          import json
          import csv

          input_file = "vulnerabilities.json"
          output_file = "vulnerability-summary.csv"

          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Could not read vulnerability report: {e}")
              data = {}

          rows = []

          components = data.get("components", [])

          for component in components:
              purl = component.get("purl", "")
              requirement = component.get("requirement", "")
              version = component.get("version", "")

              vulnerabilities = component.get("vulnerabilities", [])

              if vulnerabilities:
                  for vuln in vulnerabilities:
                      rows.append({
                          "PURL": purl,
                          "Requirement": requirement,
                          "Version": version,
                          "CVE": vuln.get("cve", ""),
                          "Severity": vuln.get("severity", ""),
                          "CVSS": vuln.get("cvss", ""),
                          "EPSS": vuln.get("epss", ""),
                          "Summary": vuln.get("summary", ""),
                          "URL": vuln.get("url", "")
                      })
              else:
                  rows.append({
                      "PURL": purl,
                      "Requirement": requirement,
                      "Version": version,
                      "CVE": "",
                      "Severity": "",
                      "CVSS": "",
                      "EPSS": "",
                      "Summary": "",
                      "URL": ""
                  })

          fieldnames = [
              "PURL",
              "Requirement",
              "Version",
              "CVE",
              "Severity",
              "CVSS",
              "EPSS",
              "Summary",
              "URL"
          ]

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Created {output_file}")
          print(f"Rows written: {len(rows)}")
          PY

      # ---------------------------------------------------------
      # 15. Set up Go
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # ---------------------------------------------------------
      # 16. Install OpenGrep
      # ---------------------------------------------------------
      - name: Install OpenGrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/v1.12.1/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 17. Check OpenGrep version
      # ---------------------------------------------------------
      - name: Check OpenGrep version
        run: |
         echo "OpenGrep location:"
          which opengrep

         echo "OpenGrep version:"
          opengrep --version

      # ---------------------------------------------------------
      # 18. Install Crypto Finder
      # ---------------------------------------------------------
      - name: Install Crypto Finder
        run: |
          go install github.com/scanoss/crypto-finder/cmd/crypto-finder@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 19. Check Crypto Finder version
      # ---------------------------------------------------------
      - name: Check Crypto Finder version
        run: |
          which crypto-finder
          crypto-finder --help

      # ---------------------------------------------------------
      # 20. Run Crypto Finder and generate CBOM
      # ---------------------------------------------------------
      - name: Run Crypto Finder and generate CBOM
        run: |
          crypto-finder scan \
            --format cyclonedx \
            --output scanoss-cbom.json \
            .

      # ---------------------------------------------------------
      # 21. Show changed files in triggering commit
      # ---------------------------------------------------------
      - name: Show changed files in triggering commit
        run: |
          echo "Commit SHA: $GITHUB_SHA"

          echo "Commit message:"
          git log -1 --pretty=%B "$GITHUB_SHA"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------"

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            --root \
            "$GITHUB_SHA" | tee changed-files.txt

          echo "----------------------------------------"

          echo ""
          echo "Contents of changed-files.txt:"
          cat changed-files.txt

          echo ""
          echo "Checking that changed-files.txt exists:"
          ls -l changed-files.txt

      # ---------------------------------------------------------
      # 22. Generate consolidated report
      # ---------------------------------------------------------
      - name: Generate consolidated report
        run: |
          python - <<'PY'
          import json
          import csv
          import os

          output_file = "consolidated-report.csv"

          rows = []

          # -----------------------------------------------------
          # ScanOSS component results
          # -----------------------------------------------------
          try:
              with open("scan-results.json", "r", encoding="utf-8") as f:
                  scan_data = json.load(f)

              for component in scan_data.get("components", []):
                  rows.append({
                      "Report Type": "ScanOSS",
                      "Component": component.get("name", ""),
                      "Version": component.get("version", ""),
                      "PURL": component.get("purl", ""),
                      "License": component.get("licenses", ""),
                      "Vulnerability": "",
                      "Severity": "",
                      "Changed File": ""
                  })
          except Exception as e:
              print(f"Could not process ScanOSS results: {e}")

          # -----------------------------------------------------
          # Vulnerability results
          # -----------------------------------------------------
          try:
              with open("vulnerabilities.json", "r", encoding="utf-8") as f:
                  vuln_data = json.load(f)

              for component in vuln_data.get("components", []):
                  for vuln in component.get("vulnerabilities", []):
                      rows.append({
                          "Report Type": "Vulnerability",
                          "Component": component.get("purl", ""),
                          "Version": component.get("version", ""),
                          "PURL": component.get("purl", ""),
                          "License": "",
                          "Vulnerability": vuln.get("cve", ""),
                          "Severity": vuln.get("severity", ""),
                          "Changed File": ""
                      })
          except Exception as e:
              print(f"Could not process vulnerability results: {e}")

          # -----------------------------------------------------
          # Changed files
          # -----------------------------------------------------
          try:
              with open("changed-files.txt", "r", encoding="utf-8") as f:
                  changed_files = f.readlines()

              for line in changed_files:
                  line = line.strip()

                  if not line:
                      continue

                  parts = line.split("\t", 1)

                  if len(parts) == 2:
                      status, filename = parts
                  else:
                      status = ""
                      filename = parts[0]

                  rows.append({
                      "Report Type": "Changed File",
                      "Component": "",
                      "Version": "",
                      "PURL": "",
                      "License": "",
                      "Vulnerability": "",
                      "Severity": status,
                      "Changed File": filename
                  })
          except Exception as e:
              print(f"Could not process changed files: {e}")

          # -----------------------------------------------------
          # Write consolidated report
          # -----------------------------------------------------
          fieldnames = [
              "Report Type",
              "Component",
              "Version",
              "PURL",
              "License",
              "Vulnerability",
              "Severity",
              "Changed File"
          ]

          with open(output_file, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Created {output_file}")
          print(f"Total rows: {len(rows)}")
          PY

      # ---------------------------------------------------------
      # 23. Display generated reports
      # ---------------------------------------------------------
      - name: List generated reports
        run: |
          echo "Generated reports:"
          ls -lh \
            scan-results.json \
            scanoss-json-report.json \
            scanoss-cyclonedx.json \
            scanoss-spdx-lite.json \
            scanoss-report.csv \
            vulnerabilities.json \
            vulnerability-summary.csv \
            scanoss-cbom.json \
            changed-files.txt \
            consolidated-report.csv

      # ---------------------------------------------------------
      # 24. Upload all reports as one artifact
      # ---------------------------------------------------------
      - name: Upload SCANOSS reports and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-reports
          path: |
            scan-results.json
            scanoss-json-report.json
            scanoss-cyclonedx.json
            scanoss-spdx-lite.json
            scanoss-report.csv
            vulnerabilities.json
            vulnerability-summary.csv
            scanoss-cbom.json
            changed-files.txt
            consolidated-report.csv
          if-no-files-found: error
