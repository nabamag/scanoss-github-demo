name: scanoss

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scanoss:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. SHOW REPOSITORY FILES
      # ---------------------------------------------------------
      - name: Show repository files
        run: |
          echo "Repository files:"
          echo "----------------------------------------"
          find . -type f \
            -not -path './.git/*' \
            | sort
          echo "----------------------------------------"

      # ---------------------------------------------------------
      # 3. SET UP PYTHON
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 4. INSTALL SCANOSS
      # ---------------------------------------------------------
      - name: Install ScanOSS
        run: |
          python -m pip install --upgrade pip
          pip install scanoss

      # ---------------------------------------------------------
      # 5. INSTALL SCANCODE TOOLKIT
      #
      # Required because ScanOSS is being run with -D
      # for dependency scanning.
      # ---------------------------------------------------------
      - name: Install ScanCode Toolkit
        run: |
          pip install scancode-toolkit

      # ---------------------------------------------------------
      # 6. VERIFY SCANCODE
      # ---------------------------------------------------------
      - name: Check ScanCode
        run: |
          scancode --version

      # ---------------------------------------------------------
      # 7. CHECK SCANOSS
      # ---------------------------------------------------------
      - name: Check ScanOSS version
        run: |
          scanoss-py --version

      # ---------------------------------------------------------
      # 8. RUN SCANOSS
      # ---------------------------------------------------------
      - name: Run ScanOSS
        run: |
          scanoss-py scan \
            -o scan-results.json \
            -D \
            --threads 10 \
            .

      # ---------------------------------------------------------
      # 9. GENERATE CYCLONEDX SBOM
      # ---------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format cyclonedx \
            --output scanoss-cyclonedx.json

      # ---------------------------------------------------------
      # 10. GENERATE SPDX-LITE SBOM
      # ---------------------------------------------------------
      - name: Generate SPDX-Lite SBOM
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format spdxlite \
            --output scanoss-spdx-lite.json

      # ---------------------------------------------------------
      # 11. SAVE SCANOSS JSON REPORT
      # ---------------------------------------------------------
      - name: Generate JSON report
        run: |
          cp scan-results.json scanoss-json-report.json

      # ---------------------------------------------------------
      # 12. GENERATE CSV REPORT
      # ---------------------------------------------------------
      - name: Generate CSV report
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format csv \
            --output scanoss-report.csv

      # ---------------------------------------------------------
      # 13. SCAN FOR VULNERABILITIES
      # ---------------------------------------------------------
      - name: Scan SBOM for vulnerabilities
        run: |
          scanoss-py comp vulns \
            -i scan-results.json \
            -o vulnerabilities.json

      # ---------------------------------------------------------
      # 14. GENERATE VULNERABILITY SUMMARY CSV
      # ---------------------------------------------------------
      - name: Generate vulnerability summary CSV
        run: |
          python - <<'PY'
          import json
          import csv

          input_file = "vulnerabilities.json"
          output_file = "vulnerability-summary.csv"

          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Could not read vulnerabilities.json: {e}")
              data = {}

          rows = []

          components = data.get("components", [])

          for component in components:
              purl = component.get("purl", "")
              requirement = component.get("requirement", "")
              version = component.get("version", "")

              vulnerabilities = component.get(
                  "vulnerabilities",
                  []
              )

              for vuln in vulnerabilities:
                  rows.append({
                      "Component": purl,
                      "Version": version,
                      "Requirement": requirement,
                      "Vulnerability": vuln.get(
                          "id",
                          vuln.get("cve", "")
                      ),
                      "Severity": vuln.get(
                          "severity",
                          ""
                      ),
                      "Summary": vuln.get(
                          "summary",
                          ""
                      ),
                      "Source": vuln.get(
                          "source",
                          ""
                      ),
                      "URL": vuln.get(
                          "url",
                          ""
                      )
                  })

          with open(
              output_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "Component",
                      "Version",
                      "Requirement",
                      "Vulnerability",
                      "Severity",
                      "Summary",
                      "Source",
                      "URL"
                  ]
              )

              writer.writeheader()
              writer.writerows(rows)

          print(
              f"Created {output_file} "
              f"with {len(rows)} vulnerabilities"
          )
          PY

      # ---------------------------------------------------------
      # 15. SET UP GO
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # ---------------------------------------------------------
      # 16. INSTALL OPENGREP
      # ---------------------------------------------------------
      - name: Install OpenGrep
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -fsSL \
            https://raw.githubusercontent.com/opengrep/opengrep/v1.12.1/install.sh \
            | bash

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 17. CHECK OPENGREP
      # ---------------------------------------------------------
      - name: Check OpenGrep version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          opengrep --version

      # ---------------------------------------------------------
      # 18. INSTALL CRYPTO FINDER
      # ---------------------------------------------------------
      - name: Install Crypto Finder
        run: |
          go install \
            github.com/scanoss/crypto-finder/cmd/crypto-finder@latest

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 19. CHECK CRYPTO FINDER
      # ---------------------------------------------------------
      - name: Check Crypto Finder
        run: |
          export PATH="$HOME/go/bin:$HOME/.local/bin:$PATH"

          crypto-finder --help > /dev/null

          echo "Crypto Finder installed successfully"

      # ---------------------------------------------------------
      # 20. GENERATE CBOM
      # ---------------------------------------------------------
      - name: Run Crypto Finder and generate CBOM
        run: |
          export PATH="$HOME/go/bin:$HOME/.local/bin:$PATH"

          crypto-finder scan \
            --format cyclonedx \
            --output scanoss-cbom.json \
            .

      # ---------------------------------------------------------
      # 21. SHOW CHANGED FILES
      # ---------------------------------------------------------
      - name: Show changed files in triggering commit
        run: |
          echo "Commit SHA: $GITHUB_SHA"

          echo "Commit message:"
          echo "----------------------------------------"

          git log -1 --pretty=%B "$GITHUB_SHA"

          echo "----------------------------------------"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------"

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            --root \
            "$GITHUB_SHA" \
            | tee changed-files.txt

          echo "----------------------------------------"

          echo ""
          echo "Contents of changed-files.txt:"

          cat changed-files.txt

      # ---------------------------------------------------------
      # 22. CREATE FULL REPOSITORY FILE STATUS
      #     CHANGED + UNCHANGED
      # ---------------------------------------------------------
      - name: Create repository file status report
        run: |
          python - <<'PY'
          import csv
          import subprocess

          changed_file_status = {}

          try:
              with open(
                  "changed-files.txt",
                  "r",
                  encoding="utf-8"
              ) as f:

                  for line in f:
                      line = line.strip()

                      if not line:
                          continue

                      parts = line.split("\t", 1)

                      if len(parts) == 2:
                          status = parts[0].strip()
                          filename = parts[1].strip()

                          changed_file_status[
                              filename
                          ] = status

          except FileNotFoundError:
              print("changed-files.txt not found")

          result = subprocess.run(
              ["git", "ls-files"],
              capture_output=True,
              text=True,
              check=True
          )

          repository_files = [
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          ]

          with open(
              "repository-file-status.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "File",
                  "Status"
              ])

              for filename in repository_files:

                  if filename in changed_file_status:
                      status = changed_file_status[
                          filename
                      ]
                  else:
                      status = "UNCHANGED"

                  writer.writerow([
                      filename,
                      status
                  ])

          print("")
          print("Repository file status report:")
          print("----------------------------------------")

          for filename in repository_files:

              status = changed_file_status.get(
                  filename,
                  "UNCHANGED"
              )

              print(
                  f"{status}\t{filename}"
              )

          print("----------------------------------------")

          print(
              "Created "
              "repository-file-status.csv"
          )
          PY

      # ---------------------------------------------------------
      # 23. GENERATE CONSOLIDATED REPORT
      #     COMPONENT + LICENSE + VULNERABILITY
      #     + CHANGED/UNCHANGED FILE
      # ---------------------------------------------------------
      - name: Generate consolidated report
        run: |
          python - <<'PY'
          import csv
          import json
          import os

          SCAN_JSON = "scanoss-json-report.json"
          VULN_JSON = "vulnerabilities.json"
          STATUS_CSV = "repository-file-status.csv"

          OUTPUT = "consolidated-report.csv"

          # -----------------------------------------------------
          # Load ScanOSS JSON
          # -----------------------------------------------------
          try:
              with open(
                  SCAN_JSON,
                  "r",
                  encoding="utf-8"
              ) as f:

                  scan_data = json.load(f)

          except Exception as e:
              print(
                  f"Could not load {SCAN_JSON}: {e}"
              )

              scan_data = {}

          # -----------------------------------------------------
          # Component/license lookup
          # -----------------------------------------------------
          component_info = {}

          def extract_license(component):

              licenses = component.get(
                  "licenses",
                  []
              )

              license_names = []

              if isinstance(licenses, list):

                  for item in licenses:

                      if not isinstance(
                          item,
                          dict
                      ):
                          continue

                      license_info = item.get(
                          "license",
                          {}
                      )

                      if isinstance(
                          license_info,
                          dict
                      ):

                          license_id = (
                              license_info.get(
                                  "id"
                              )
                          )

                          if license_id:
                              license_names.append(
                                  str(license_id)
                              )

              if license_names:
                  return ", ".join(
                      dict.fromkeys(
                          license_names
                      )
                  )

              direct_license = component.get(
                  "license"
              )

              if isinstance(
                  direct_license,
                  str
              ) and direct_license:

                  return direct_license

              if isinstance(
                  direct_license,
                  dict
              ):

                  license_id = (
                      direct_license.get(
                          "id"
                      )
                  )

                  if license_id:
                      return str(
                          license_id
                      )

              return "UNKNOWN"

          # -----------------------------------------------------
          # Recursively inspect ScanOSS JSON
          # -----------------------------------------------------
          def walk(value):

              if isinstance(value, dict):

                  if "purl" in value:

                      purl = value.get(
                          "purl",
                          ""
                      )

                      if purl:

                          component_info[
                              purl
                          ] = {
                              "Component": purl,
                              "Version": value.get(
                                  "version",
                                  ""
                              ),
                              "License": extract_license(
                                  value
                              )
                          }

                  for child in value.values():
                      walk(child)

              elif isinstance(value, list):

                  for item in value:
                      walk(item)

          walk(scan_data)

          # -----------------------------------------------------
          # Load vulnerabilities
          # -----------------------------------------------------
          try:
              with open(
                  VULN_JSON,
                  "r",
                  encoding="utf-8"
              ) as f:

                  vuln_data = json.load(f)

          except Exception as e:
              print(
                  f"Could not load {VULN_JSON}: {e}"
              )

              vuln_data = {}

          rows = []

          # -----------------------------------------------------
          # Vulnerability rows
          # -----------------------------------------------------
          for component in vuln_data.get(
              "components",
              []
          ):

              purl = component.get(
                  "purl",
                  ""
              )

              version = component.get(
                  "version",
                  ""
              )

              license_value = (
                  component_info
                  .get(purl, {})
                  .get(
                      "License",
                      "UNKNOWN"
                  )
              )

              vulnerabilities = (
                  component.get(
                      "vulnerabilities",
                      []
                  )
              )

              for vuln in vulnerabilities:

                  rows.append([
                      "Vulnerability",
                      purl,
                      version,
                      purl,
                      license_value,
                      vuln.get(
                          "id",
                          vuln.get(
                              "cve",
                              ""
                          )
                      ),
                      vuln.get(
                          "severity",
                          ""
                      ),
                      ""
                  ])

          # -----------------------------------------------------
          # Component rows
          # -----------------------------------------------------
          for purl, info in component_info.items():

              rows.append([
                  "Component",
                  info.get(
                      "Component",
                      ""
                  ),
                  info.get(
                      "Version",
                      ""
                  ),
                  purl,
                  info.get(
                      "License",
                      "UNKNOWN"
                  ),
                  "",
                  "",
                  ""
              ])

          # -----------------------------------------------------
          # Changed + unchanged files
          # -----------------------------------------------------
          if os.path.exists(
              STATUS_CSV
          ):

              with open(
                  STATUS_CSV,
                  "r",
                  encoding="utf-8"
              ) as f:

                  reader = csv.DictReader(f)

                  for item in reader:

                      filename = item.get(
                          "File",
                          ""
                      )

                      status = item.get(
                          "Status",
                          ""
                      )

                      if not filename:
                          continue

                      rows.append([
                          "File",
                          "",
                          "",
                          "",
                          "",
                          "",
                          status,
                          filename
                      ])

          # -----------------------------------------------------
          # Write consolidated CSV
          # -----------------------------------------------------
          with open(
              OUTPUT,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "Report Type",
                  "Component",
                  "Version",
                  "PURL",
                  "License",
                  "Vulnerability",
                  "Severity",
                  "Changed File"
              ])

              writer.writerows(rows)

          print("")
          print(
              f"Created {OUTPUT}"
          )

          print(
              f"Total rows: {len(rows)}"
          )

          print("")
          print("License values detected:")
          print("----------------------------------------")

          licenses = sorted(
              set(
                  row[4]
                  for row in rows
                  if row[4]
              )
          )

          for license_name in licenses:
              print(license_name)

          print("----------------------------------------")
          PY

      # ---------------------------------------------------------
      # 24. LIST GENERATED REPORTS
      # ---------------------------------------------------------
      - name: List generated reports
        run: |
          echo "Generated reports:"
          echo "----------------------------------------"

          ls -lh \
            changed-files.txt \
            repository-file-status.csv \
            consolidated-report.csv \
            scan-results.json \
            scanoss-cbom.json \
            scanoss-cyclonedx.json \
            scanoss-json-report.json \
            scanoss-report.csv \
            scanoss-spdx-lite.json \
            vulnerabilities.json \
            vulnerability-summary.csv

          echo "----------------------------------------"

      # ---------------------------------------------------------
      # 25. UPLOAD ALL REPORTS
      # ---------------------------------------------------------
      - name: Upload ScanOSS reports and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-reports
          path: |
            changed-files.txt
            repository-file-status.csv
            consolidated-report.csv
            scan-results.json
            scanoss-json-report.json
            scanoss-cyclonedx.json
            scanoss-spdx-lite.json
            scanoss-report.csv
            vulnerabilities.json
            vulnerability-summary.csv
            scanoss-cbom.json
          if-no-files-found: error
