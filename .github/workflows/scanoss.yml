name: scanoss

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanoss:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # 2. SHOW REPOSITORY FILES
      # ------------------------------------------------------------
      - name: Show repository files
        run: |
          echo "Repository files:"
          echo "----------------------------------------"
          find . -type f \
            -not -path './.git/*' \
            | sort
          echo "----------------------------------------"


      # ------------------------------------------------------------
      # 3. SET UP PYTHON
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ------------------------------------------------------------
      # 4. INSTALL SCANOSS
      # ------------------------------------------------------------
      - name: Install ScanOSS
        run: |
          python -m pip install --upgrade pip
          pip install "scanoss[fast_winnowing]"


      # ------------------------------------------------------------
      # 5. CHECK SCANOSS VERSION
      # ------------------------------------------------------------
      - name: Check ScanOSS version
        run: |
          scanoss-py --version


      # ------------------------------------------------------------
      # 6. GENERATE WFP / FINGERPRINTS
      #
      # This separates fingerprint generation from the API scan.
      # This is more efficient and gives us a fallback if the
      # dependency API is temporarily unavailable.
      # ------------------------------------------------------------
      - name: Generate SCANOSS fingerprints
        run: |
          echo "Generating SCANOSS fingerprints..."

          scanoss-py wfp \
            -o repository.wfp \
            .

          echo ""
          echo "Fingerprint file:"
          ls -lh repository.wfp


      # ------------------------------------------------------------
      # 7. INSTALL SCANCODE
      #
      # Required only for local dependency detection.
      # ------------------------------------------------------------
      - name: Install ScanCode
        run: |
          pip install scancode-toolkit

          echo "Checking ScanCode installation..."
          scancode --version


      # ------------------------------------------------------------
      # 8. GENERATE DEPENDENCY FILE
      #
      # This is deliberately separated from the main SCANOSS scan.
      # If dependency extraction itself has a problem, the workflow
      # can continue with the fingerprint-based scan.
      # ------------------------------------------------------------
      - name: Generate dependency file
        continue-on-error: true
        run: |
          echo "Generating dependency information..."

          scanoss-py dep \
            -o repository-dependencies.json \
            .

          echo ""
          echo "Dependency file:"
          ls -lh repository-dependencies.json || true


      # ------------------------------------------------------------
      # 9. RUN SCANOSS
      #
      # First attempt:
      #   WFP + dependency data
      #
      # If the dependency decoration service returns 503 or another
      # error, fall back to a WFP-only scan.
      #
      # This prevents a temporary dependency API outage from
      # destroying the complete scan.
      # ------------------------------------------------------------
      - name: Run ScanOSS
        run: |
          set +e

          echo "========================================"
          echo "Attempting SCANOSS scan with dependencies"
          echo "========================================"

          if [ -f repository-dependencies.json ]; then

            scanoss-py scan \
              --wfp repository.wfp \
              --dep repository-dependencies.json \
              --retry 5 \
              --timeout 180 \
              -o scan-results.json

            SCAN_EXIT=$?

          else

            echo "Dependency file not available."
            echo "Skipping dependency decoration."

            SCAN_EXIT=1

          fi

          echo ""
          echo "Combined scan exit code: $SCAN_EXIT"


          # --------------------------------------------------------
          # FALLBACK
          # --------------------------------------------------------
          #
          # If dependency decoration fails, perform a normal WFP
          # scan. This still gives us the SCANOSS component/file/
          # snippet/license results.
          # --------------------------------------------------------

          if [ "$SCAN_EXIT" -ne 0 ] || [ ! -s scan-results.json ]; then

            echo ""
            echo "========================================"
            echo "Dependency scan failed."
            echo "Running WFP-only fallback scan."
            echo "========================================"

            rm -f scan-results.json

            scanoss-py scan \
              --wfp repository.wfp \
              --retry 5 \
              --timeout 180 \
              -o scan-results.json

            FALLBACK_EXIT=$?

            if [ "$FALLBACK_EXIT" -ne 0 ] || [ ! -s scan-results.json ]; then
              echo ""
              echo "SCANOSS fallback scan also failed."
              exit 1
            fi

            echo ""
            echo "WFP-only SCANOSS scan completed successfully."

          else

            echo ""
            echo "SCANOSS scan with dependencies completed successfully."

          fi


          echo ""
          echo "Scan results:"
          ls -lh scan-results.json


      # ------------------------------------------------------------
      # 10. GENERATE CYCLONEDX SBOM
      # ------------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format cyclonedx \
            --output scanoss-cyclonedx.json

          echo "CycloneDX SBOM:"
          ls -lh scanoss-cyclonedx.json


      # ------------------------------------------------------------
      # 11. GENERATE SPDX-LITE SBOM
      # ------------------------------------------------------------
      - name: Generate SPDX Lite SBOM
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format spdxlite \
            --output scanoss-spdx-lite.json

          echo "SPDX Lite SBOM:"
          ls -lh scanoss-spdx-lite.json


      # ------------------------------------------------------------
      # 12. GENERATE SCANOSS CSV REPORT
      # ------------------------------------------------------------
      - name: Generate CSV report
        run: |
          scanoss-py cnv \
            --input scan-results.json \
            --format csv \
            --output scanoss-report.csv

          echo "SCANOSS CSV:"
          ls -lh scanoss-report.csv


      # ------------------------------------------------------------
      # 13. COPY RAW JSON REPORT
      # ------------------------------------------------------------
      - name: Generate JSON report
        run: |
          cp scan-results.json scanoss-json-report.json

          echo "JSON report:"
          ls -lh scanoss-json-report.json


      # ------------------------------------------------------------
      # 14. GENERATE LICENSE SUMMARY
      #
      # This is an additional SCANOSS-native license report.
      # ------------------------------------------------------------
      - name: Generate license summary
        continue-on-error: true
        run: |
          scanoss-py insp license-summary \
            -i scan-results.json \
            -o license-summary.json

          echo "License summary:"
          ls -lh license-summary.json || true


      # ------------------------------------------------------------
      # 15. GENERATE COMPONENT SUMMARY
      # ------------------------------------------------------------
      - name: Generate component summary
        continue-on-error: true
        run: |
          scanoss-py insp component-summary \
            -i scan-results.json \
            -o component-summary.json

          echo "Component summary:"
          ls -lh component-summary.json || true


      # ------------------------------------------------------------
      # 16. EXTRACT PURLS FOR VULNERABILITY SCANNING
      #
      # The CycloneDX SBOM can be supplied directly to the
      # SCANOSS vulnerability command.
      # ------------------------------------------------------------
      - name: Scan SBOM for vulnerabilities
        continue-on-error: true
        run: |
          echo "Scanning CycloneDX SBOM for vulnerabilities..."

          scanoss-py comp vulns \
            -i scanoss-cyclonedx.json \
            -o vulnerabilities.json

          echo ""
          echo "Vulnerability report:"
          ls -lh vulnerabilities.json || true


      # ------------------------------------------------------------
      # 17. GENERATE VULNERABILITY SUMMARY CSV
      # ------------------------------------------------------------
      - name: Generate vulnerability summary CSV
        continue-on-error: true
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          input_file = Path("vulnerabilities.json")
          output_file = Path("vulnerability-summary.csv")

          headers = [
              "PURL",
              "Version",
              "Requirement",
              "CVE",
              "Severity",
              "CVSS",
              "Summary",
              "URL"
          ]

          rows = []

          if not input_file.exists():
              print("vulnerabilities.json not found.")
              output_file.write_text("")
              raise SystemExit(0)

          try:
              data = json.loads(input_file.read_text())
          except Exception as exc:
              print(f"Could not parse vulnerabilities.json: {exc}")
              output_file.write_text("")
              raise SystemExit(0)

          def walk(obj, current_purl="",
                   current_version="",
                   current_requirement=""):

              if isinstance(obj, dict):

                  purl = obj.get("purl", current_purl)
                  version = obj.get("version", current_version)
                  requirement = obj.get(
                      "requirement",
                      current_requirement
                  )

                  vulnerabilities = obj.get("vulnerabilities")

                  if isinstance(vulnerabilities, list):

                      for vuln in vulnerabilities:

                          if isinstance(vuln, dict):

                              cve = (
                                  vuln.get("cve")
                                  or vuln.get("id")
                                  or ""
                              )

                              severity = vuln.get(
                                  "severity",
                                  ""
                              )

                              cvss = vuln.get(
                                  "cvss",
                                  ""
                              )

                              summary = vuln.get(
                                  "summary",
                                  ""
                              )

                              url = vuln.get(
                                  "url",
                                  ""
                              )

                              rows.append([
                                  purl,
                                  version,
                                  requirement,
                                  cve,
                                  severity,
                                  cvss,
                                  summary,
                                  url
                              ])

                  for value in obj.values():
                      walk(
                          value,
                          purl,
                          version,
                          requirement
                      )

              elif isinstance(obj, list):

                  for item in obj:
                      walk(
                          item,
                          current_purl,
                          current_version,
                          current_requirement
                      )

          walk(data)

          # Remove duplicate rows.
          unique_rows = []
          seen = set()

          for row in rows:
              key = tuple(str(x) for x in row)

              if key not in seen:
                  seen.add(key)
                  unique_rows.append(row)

          with output_file.open(
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)
              writer.writerow(headers)
              writer.writerows(unique_rows)

          print(
              f"Wrote {len(unique_rows)} vulnerability rows "
              f"to {output_file}"
          )
          PY

          echo ""
          ls -lh vulnerability-summary.csv


      # ------------------------------------------------------------
      # 18. INSTALL CRYPTO FINDER
      # ------------------------------------------------------------
      - name: Install Crypto Finder
        run: |
          pip install crypto-finder


      # ------------------------------------------------------------
      # 19. CHECK CRYPTO FINDER
      #
      # Do NOT use "crypto-finder --version" because the version
      # flag is not supported by the version you have been using.
      # ------------------------------------------------------------
      - name: Check Crypto Finder installation
        run: |
          which crypto-finder
          crypto-finder --help | head -30


      # ------------------------------------------------------------
      # 20. RUN CRYPTO FINDER AND GENERATE CBOM
      #
      # If the remote DCA ruleset is unavailable for the account,
      # don't destroy the rest of the workflow.
      # ------------------------------------------------------------
      - name: Run Crypto Finder and generate CBOM
        continue-on-error: true
        run: |
          echo "Running Crypto Finder..."

          crypto-finder scan \
            --output scanoss-cbom.json \
            .

          echo ""
          echo "CBOM:"
          ls -lh scanoss-cbom.json || true


      # ------------------------------------------------------------
      # 21. SHOW CHANGED FILES
      # ------------------------------------------------------------
      - name: Show changed files in triggering commit
        run: |
          echo "Commit SHA: $GITHUB_SHA"

          echo "Commit message:"
          git log -1 --pretty=%B "$GITHUB_SHA"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------"

          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            --root \
            "$GITHUB_SHA" | tee changed-files.txt

          echo "----------------------------------------"

          echo ""
          echo "Contents of changed-files.txt:"
          cat changed-files.txt


      # ------------------------------------------------------------
      # 22. CREATE COMPLETE REPOSITORY FILE STATUS
      #
      # This gives us BOTH:
      #
      #   M = Modified
      #   A = Added
      #   D = Deleted
      #   U = Unchanged
      #
      # This is important because changed-files.txt alone only
      # describes the triggering commit.
      # ------------------------------------------------------------
      - name: Create repository file status report
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import os
          import subprocess

          commit_sha = os.environ["COMMIT_SHA"]

          changed = {}

          try:
              output = subprocess.check_output(
                  [
                      "git",
                      "diff-tree",
                      "--no-commit-id",
                      "--name-status",
                      "-r",
                      "--root",
                      commit_sha
                  ],
                  text=True
              )

              for line in output.splitlines():

                  parts = line.split("\t", 1)

                  if len(parts) == 2:
                      status, path = parts
                      changed[path] = status

          except subprocess.CalledProcessError as exc:
              print(
                  f"Could not determine changed files: {exc}"
              )

          files = subprocess.check_output(
              [
                  "git",
                  "ls-files"
              ],
              text=True
          ).splitlines()

          with open(
              "repository-file-status.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "File",
                  "Status"
              ])

              for path in files:

                  status = changed.get(
                      path,
                      "U"
                  )

                  writer.writerow([
                      path,
                      status
                  ])

          print(
              f"Repository file status generated for "
              f"{len(files)} tracked files."
          )
          PY

          echo ""
          echo "Repository file status:"
          head -20 repository-file-status.csv

      # ------------------------------------------------------------
      # 23. GENERATE CONSOLIDATED REPORT
      #
      # Columns:
      #
      # Report Type
      # Component
      # Version
      # PURL
      # License
      # Vulnerability
      # Severity
      # Changed File
      #
      # License is extracted from SCANOSS JSON.
      # ------------------------------------------------------------
      - name: Generate consolidated report
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          scan_file = Path("scan-results.json")
          vuln_file = Path("vulnerabilities.json")
          status_file = Path("repository-file-status.csv")

          output_file = Path(
              "consolidated-report.csv"
          )

          rows = []

          # --------------------------------------------------------
          # Read repository status
          # --------------------------------------------------------

          file_status = {}

          if status_file.exists():

              with status_file.open(
                  newline="",
                  encoding="utf-8"
              ) as f:

                  reader = csv.DictReader(f)

                  for row in reader:

                      file_status[row["File"]] = row["Status"]


          # --------------------------------------------------------
          # License extraction helpers
          # --------------------------------------------------------

          def license_names(value):

              result = []

              if isinstance(value, list):

                  for item in value:

                      if isinstance(item, dict):

                          name = (
                              item.get("name")
                              or item.get("license")
                              or item.get("id")
                              or item.get("licenseId")
                          )

                          if name:
                              result.append(str(name))

                      elif isinstance(item, str):

                          result.append(item)

              elif isinstance(value, dict):

                  name = (
                      value.get("name")
                      or value.get("license")
                      or value.get("id")
                      or value.get("licenseId")
                  )

                  if name:
                      result.append(str(name))

              elif isinstance(value, str):

                  result.append(value)

              return result


          def add_scan_result(
              path,
              component,
              version,
              purl,
              licenses,
              match_type
          ):

              if not licenses:
                  licenses = ["UNKNOWN"]

              rows.append([
                  "SCANOSS",
                  component or "",
                  version or "",
                  purl or "",
                  "; ".join(licenses),
                  "",
                  "",
                  path or "",
                  file_status.get(path, "U")
              ])


          # --------------------------------------------------------
          # Read SCANOSS JSON
          # --------------------------------------------------------

          if scan_file.exists():

              try:
                  data = json.loads(
                      scan_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:

                  print(
                      f"Could not parse scan-results.json: {exc}"
                  )
                  data = {}

              if isinstance(data, dict):

                  for path, results in data.items():

                      if not isinstance(results, list):
                          continue

                      for result in results:

                          if not isinstance(result, dict):
                              continue

                          component = (
                              result.get("component")
                              or result.get("name")
                              or ""
                          )

                          purls = result.get(
                              "purl",
                              []
                          )

                          if isinstance(purls, str):
                              purls = [purls]

                          if not isinstance(purls, list):
                              purls = []

                          version = (
                              result.get("version")
                              or ""
                          )

                          licenses = license_names(
                              result.get(
                                  "licenses",
                                  []
                              )
                          )

                          # Some SCANOSS results may expose
                          # license information elsewhere.
                          if not licenses:

                              licenses = license_names(
                                  result.get(
                                      "license",
                                      []
                                  )
                              )

                          match_type = (
                              result.get(
                                  "id",
                                  ""
                              )
                          )

                          if purls:

                              for purl in purls:

                                  add_scan_result(
                                      path,
                                      component,
                                      version,
                                      purl,
                                      licenses,
                                      match_type
                                  )

                          else:

                              add_scan_result(
                                  path,
                                  component,
                                  version,
                                  "",
                                  licenses,
                                  match_type
                              )


          # --------------------------------------------------------
          # Read vulnerabilities
          # --------------------------------------------------------

          if vuln_file.exists():

              try:

                  vuln_data = json.loads(
                      vuln_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:

                  print(
                      f"Could not parse vulnerabilities.json: {exc}"
                  )
                  vuln_data = {}

              def walk_vulnerabilities(
                  obj,
                  purl="",
                  version="",
                  component=""
              ):

                  if isinstance(obj, dict):

                      purl = obj.get(
                          "purl",
                          purl
                      )

                      version = obj.get(
                          "version",
                          version
                      )

                      component = obj.get(
                          "component",
                          component
                      )

                      vulnerabilities = obj.get(
                          "vulnerabilities"
                      )

                      if isinstance(
                          vulnerabilities,
                          list
                      ):

                          for vuln in vulnerabilities:

                              if not isinstance(
                                  vuln,
                                  dict
                              ):
                                  continue

                              rows.append([
                                  "Vulnerability",
                                  component,
                                  version,
                                  purl,
                                  "",
                                  vuln.get(
                                      "cve",
                                      vuln.get(
                                          "id",
                                          ""
                                      )
                                  ),
                                  vuln.get(
                                      "severity",
                                      ""
                                  ),
                                  "",
                                  ""
                              ])

                      for value in obj.values():

                          walk_vulnerabilities(
                              value,
                              purl,
                              version,
                              component
                          )

                  elif isinstance(obj, list):

                      for item in obj:

                          walk_vulnerabilities(
                              item,
                              purl,
                              version,
                              component
                          )

              walk_vulnerabilities(
                  vuln_data
              )


          # --------------------------------------------------------
          # Add changed files even when SCANOSS didn't match them
          # --------------------------------------------------------

          for path, status in file_status.items():

              if status != "U":

                  rows.append([
                      "Changed File",
                      "",
                      "",
                      "",
                      "",
                      "",
                      "",
                      path,
                      status
                  ])


          # --------------------------------------------------------
          # Deduplicate rows
          # --------------------------------------------------------

          unique = []
          seen = set()

          for row in rows:

              key = tuple(
                  str(value)
                  for value in row
              )

              if key not in seen:

                  seen.add(key)
                  unique.append(row)


          # --------------------------------------------------------
          # Write consolidated CSV
          # --------------------------------------------------------

          with output_file.open(
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "Report Type",
                  "Component",
                  "Version",
                  "PURL",
                  "License",
                  "Vulnerability",
                  "Severity",
                  "File",
                  "File Status"
              ])

              writer.writerows(
                  unique
              )

          print(
              f"Created {output_file} with "
              f"{len(unique)} rows."
          )
          PY

          echo ""
          echo "Consolidated report:"
          ls -lh consolidated-report.csv

          echo ""
          echo "First rows:"
          head -20 consolidated-report.csv


      # ------------------------------------------------------------
      # 24. LIST GENERATED REPORTS
      # ------------------------------------------------------------
      - name: List generated reports
        run: |
          echo "Generated reports:"
          echo "----------------------------------------"

          ls -lh \
            changed-files.txt \
            repository-file-status.csv \
            consolidated-report.csv \
            scan-results.json \
            scanoss-json-report.json \
            scanoss-cyclonedx.json \
            scanoss-spdx-lite.json \
            scanoss-report.csv \
            vulnerabilities.json \
            vulnerability-summary.csv \
            license-summary.json \
            component-summary.json \
            scanoss-cbom.json \
            repository.wfp \
            repository-dependencies.json \
            2>/dev/null || true

          echo "----------------------------------------"


      # ------------------------------------------------------------
      # 25. UPLOAD ALL REPORTS
      # ------------------------------------------------------------
      - name: Upload SCANOSS reports and SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-reports
          path: |
            changed-files.txt
            repository-file-status.csv
            consolidated-report.csv
            scan-results.json
            scanoss-json-report.json
            scanoss-cyclonedx.json
            scanoss-spdx-lite.json
            scanoss-report.csv
            vulnerabilities.json
            vulnerability-summary.csv
            license-summary.json
            component-summary.json
            scanoss-cbom.json
            repository.wfp
            repository-dependencies.json
          if-no-files-found: warn
